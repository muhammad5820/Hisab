name: Build Hisab APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and patch project
        run: |
          unzip -o Hisab_Android_Studio_Project.zip
          python3 -c "p='Hisab/app/src/main/java/com/hisab/app/ui/screens/PersonDetailScreen.kt'; s=open(p).read().replace('MessagingHelper.buildReminderMessage(personWithPayments, currencySymbol)', 'MessagingHelper.buildReminderMessage(personWithPayments!!, currencySymbol)'); open(p,'w').write(s)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: Hisab
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-debug-apk
          path: Hisab/app/build/outputs/apk/debug/app-debug.apk
